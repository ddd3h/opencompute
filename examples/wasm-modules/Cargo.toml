# Separate workspace: these crates target wasm32-unknown-unknown.
[workspace]
resolver = "2"
members = ["hello-world", "fibonacci", "nbody"]

[workspace.dependencies]
opencompute-guest = { path = "../../crates/guest" }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
