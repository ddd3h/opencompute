<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif">
<title>サーバー中継と直接交換</title><desc>既定の中継方式は4台のPCが毎ステップ中央サーバーと通信する。直接交換では隣のPCだけとハロ行を交換し、サーバーには進捗とチェックポイントを送る。直接通信が停止すると巻き戻し、2回続けば中継に切り替える。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
<g id="pc" stroke="#16a34a" stroke-width="2"><rect width="68" height="44" rx="10" fill="#dcfce7"/><path d="M34 44V54M18 54H50"/><path d="M8 12H60M8 21H60M8 30H60" stroke-opacity=".45"/></g>
<g id="server" stroke="#2563eb" stroke-width="2" fill="#dbeafe"><rect width="82" height="30" rx="10"/><rect y="34" width="82" height="30" rx="10"/><circle cx="14" cy="15" r="3" fill="#2563eb"/><circle cx="14" cy="49" r="3" fill="#2563eb"/></g></defs>
<rect width="960" height="640" rx="10" fill="white"/><text x="32" y="48" font-size="28" font-weight="bold" fill="#0f172a">ハロ行の交換：サーバー中継と直接交換</text>
<rect x="24" y="78" width="444" height="420" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="486" y="78" width="450" height="420" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g fill="#0f172a" font-size="22" font-weight="bold"><text x="46" y="115">サーバー中継(既定)</text><text x="508" y="115">直接交換(--direct)</text></g>
<g stroke="#2563eb" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"><path d="M143 215 209 276"/><path d="M348 215 282 276"/><path d="M143 378 209 330"/><path d="M348 378 282 330"/></g>
<use href="#server" x="205" y="268"/><text x="202" y="357" font-size="16" fill="#2563eb">サーバー</text>
<use href="#pc" x="88" y="165"/><use href="#pc" x="334" y="165"/><use href="#pc" x="88" y="375"/><use href="#pc" x="334" y="375"/>
<g font-size="16" fill="#0f172a" text-anchor="middle"><text x="122" y="154">PC1・領域0</text><text x="368" y="154">PC2・領域1</text><text x="122" y="453">PC3・領域2</text><text x="368" y="453">PC4・領域3</text></g>
<use href="#server" x="671" y="143"/><text x="670" y="231" font-size="16" fill="#2563eb">サーバー</text>
<path d="M711 297V243" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<rect x="745" y="244" width="171" height="57" rx="10" fill="#f1f5f9"/><text x="756" y="266" font-size="16" fill="#64748b"><tspan x="756">進捗と</tspan><tspan x="756" dy="23">チェックポイント</tspan></text>
<use href="#pc" x="506" y="324"/><use href="#pc" x="620" y="324"/><use href="#pc" x="734" y="324"/><use href="#pc" x="848" y="324"/>
<g fill="none" stroke="#2563eb" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"><path d="M579 344H615"/><path d="M693 344H729"/><path d="M807 344H843"/></g>
<g font-size="16" text-anchor="middle" fill="#0f172a"><text x="540" y="405">PC1</text><text x="654" y="405">PC2</text><text x="768" y="405">PC3</text><text x="882" y="405">PC4</text><text x="540" y="429">領域0</text><text x="654" y="429">領域1</text><text x="768" y="429">領域2</text><text x="882" y="429">領域3</text></g>
<g font-size="17" fill="#0f172a"><text x="44" y="529">毎ステップ全員が揃うのを待つ(バリア)</text><text x="495" y="529">サーバーはデータの通り道にならない</text></g>
<rect x="24" y="552" width="912" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="45" y="578" font-size="17" fill="#0f172a"><tspan x="45">直接がつながらない場合: 20秒進まない → 巻き戻し →</tspan><tspan x="45" dy="25">2回続けたらサーバー中継に自動切替</tspan></text>
</svg>
