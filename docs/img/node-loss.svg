<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif">
<title>ノード消失からの再割り当て</title><desc>通常はクライアントAがタスク1と2、Bが3と4を担当。Aの強制終了でハートビートが途切れると、1と2をキュー先頭へ戻してBに再割り当てする。タスク、試行、ノードの照合で二重確定を防ぐ。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker><g id="pc" fill="#dcfce7" stroke="#16a34a" stroke-width="2"><rect width="48" height="32" rx="6"/><path d="M24 32V42M10 42H38"/></g><g id="server" fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect width="46" height="17" rx="5"/><rect y="23" width="46" height="17" rx="5"/><circle cx="9" cy="8" r="2" fill="#2563eb"/><circle cx="9" cy="31" r="2" fill="#2563eb"/></g></defs>
<rect width="960" height="650" rx="20" fill="white"/><text x="32" y="48" font-size="28" font-weight="bold" fill="#0f172a">ノードが消えても、タスクを引き継ぐ</text>
<g stroke="#64748b" stroke-width="2" fill="#f1f5f9"><rect x="24" y="85" width="292" height="439" rx="10"/><rect x="334" y="85" width="292" height="439" rx="10"/><rect x="644" y="85" width="292" height="439" rx="10"/></g>
<g font-size="20" font-weight="bold" fill="#0f172a"><text x="42" y="120">① 通常運転</text><text x="352" y="120">② Client A が突然停止</text><text x="662" y="120">③ 再割り当て</text></g><text x="352" y="149" font-size="17" fill="#dc2626">強制終了 (kill -9)</text>
<g><use href="#server" x="49" y="171"/><use href="#server" x="359" y="171"/><use href="#server" x="669" y="171"/></g>
<g fill="#1e40af" font-size="16"><text x="108" y="187">サーバー</text><text x="108" y="212">待機キュー</text><text x="418" y="187">サーバー</text><text x="418" y="212">応答を監視</text><text x="728" y="187">サーバー</text><text x="728" y="212">キュー先頭へ戻す</text></g>
<g fill="white" stroke="#16a34a" stroke-width="2"><rect x="43" y="292" width="254" height="87" rx="10"/><rect x="43" y="409" width="254" height="87" rx="10"/><rect x="353" y="292" width="254" height="87" rx="10" stroke="#dc2626" fill="#fee2e2"/><rect x="353" y="409" width="254" height="87" rx="10"/><rect x="663" y="409" width="254" height="87" rx="10"/></g>
<g><use href="#pc" x="58" y="313"/><use href="#pc" x="58" y="430"/><use href="#pc" x="368" y="313"/><use href="#pc" x="368" y="430"/><use href="#pc" x="678" y="430"/></g>
<g font-size="17" fill="#166534"><text x="120" y="324">Client A<tspan x="120" dy="28">タスク 1・2</tspan></text><text x="120" y="441">Client B<tspan x="120" dy="28">タスク 3・4</tspan></text><text x="430" y="324" fill="#991b1b">Client A：停止<tspan x="430" dy="28">タスク 1・2 中断</tspan></text><text x="430" y="441">Client B<tspan x="430" dy="28">タスク 3・4</tspan></text><text x="740" y="439">Client B<tspan x="740" dy="25">3・4 の後に</tspan><tspan x="740" dy="22">1・2 を実行</tspan></text></g>
<g fill="none" stroke-width="2" marker-end="url(#a)"><path d="M240 222H280V282" stroke="#2563eb"/><path d="M60 222H34V398H170V407" stroke="#2563eb"/><path d="M480 282V225" stroke="#dc2626" stroke-dasharray="5 5"/><path d="M900 320V398" stroke="#2563eb"/></g>
<text x="66" y="259" font-size="16" fill="#2563eb">タスクを割り当て</text><rect x="350" y="241" width="260" height="28" rx="6" fill="#fee2e2"/><text x="360" y="261" font-size="16" fill="#dc2626">◯秒ハートビートなし</text>
<path d="M369 309L414 354M414 309L369 354" stroke="#dc2626" stroke-width="4"/>
<g stroke="#2563eb" stroke-width="2" fill="#dbeafe"><rect x="669" y="259" width="66" height="57" rx="10"/><rect x="744" y="259" width="66" height="57" rx="10"/><rect x="819" y="259" width="98" height="57" rx="10" fill="white" stroke="#64748b"/></g><g text-anchor="middle" font-size="17" fill="#1e40af"><text x="702" y="294">1</text><text x="777" y="294">2</text><text x="868" y="294" fill="#64748b">待機分</text></g><text x="673" y="343" font-size="14" fill="#2563eb">先頭</text><text x="680" y="384" font-size="16" fill="#1e40af">試行回数は消費しない</text>
<rect x="24" y="548" width="912" height="78" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="46" y="579" font-size="17" fill="#78350f">古い結果が届いても (task, attempt, node) が一致しなければ捨てる<tspan x="46" dy="28" font-weight="bold">→ 二重確定しない</tspan></text>
</svg>
