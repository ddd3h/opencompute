<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" fill="#0f172a">
<title>測定に使ったクラスタ</title>
<desc>サーバーと 4 台の計算機 A〜D の接続図。サーバーから各計算機への回線の速さと、位置データを A から B と C へ転送する経路を示す。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<rect width="960" height="570" rx="10" fill="white"/>
<text x="32" y="46" font-size="26" font-weight="bold">測定に使ったクラスタ</text>
<rect x="60" y="200" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="160.0" y="230" text-anchor="middle" font-size="19" font-weight="bold">サーバー</text>
<text x="160.0" y="254" text-anchor="middle" font-size="14" fill="#475569">位置データと結果を管理</text>
<rect x="520" y="70" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="650.0" y="100" text-anchor="middle" font-size="19" font-weight="bold">計算機 A</text>
<text x="650.0" y="124" text-anchor="middle" font-size="14" fill="#475569">32 コア / 他の利用者あり</text>
<rect x="520" y="200" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="650.0" y="230" text-anchor="middle" font-size="19" font-weight="bold">計算機 B</text>
<text x="650.0" y="254" text-anchor="middle" font-size="14" fill="#475569">16 コア</text>
<rect x="520" y="330" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="650.0" y="360" text-anchor="middle" font-size="19" font-weight="bold">計算機 C</text>
<text x="650.0" y="384" text-anchor="middle" font-size="14" fill="#475569">3 コア / AVX2 なし</text>
<rect x="520" y="440" width="260" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="650.0" y="470" text-anchor="middle" font-size="19" font-weight="bold">計算機 D</text>
<text x="650.0" y="494" text-anchor="middle" font-size="14" fill="#475569">16 コア / ssh トンネル経由</text>
<path d="M260 225L520 110" stroke="#16a34a" stroke-width="6" fill="none"/>
<text x="360" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">約 10 MB/s(最速)</text>
<path d="M260 240L520 240" stroke="#d97706" stroke-width="2.5" fill="none"/>
<text x="390" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">約 1.4 MB/s</text>
<path d="M260 255L520 370" stroke="#d97706" stroke-width="2.5" fill="none"/>
<text x="372" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">約 1.4 MB/s</text>
<path d="M260 270L520 472" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="8 5"/>
<text x="330" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">TCP に載せた UDP</text>
<path d="M800 120C860 120 860 235 800 240" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M800 110C890 110 890 365 800 370" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="868" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">A から</text>
<text x="868" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">転送</text>
<text x="32" y="550" font-size="14" fill="#475569">太い緑線: 速い回線。橙線: 遅い回線(tailscale の中継 DERP 経由)。青矢印: 計算機どうしの転送。</text>
</svg>
