<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif">
<title>タスクのライフサイクルと再試行</title><desc>待機、割り当て、実行、完了の遷移。失敗時は残り回数に応じて再試行または失敗。ノード消失時は回数を消費せずキュー先頭へ戻り、ジョブのキャンセルでは取消状態になる。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect width="960" height="790" rx="20" fill="white"/>
<g fill="#0f172a"><text x="32" y="48" font-size="28" font-weight="bold">タスクのライフサイクル</text><text x="32" y="80" font-size="16" fill="#64748b">1つのタスクの状態と、再割り当てのルール</text></g>
<g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"><path d="M202 218H258"/><path d="M430 218H486"/><path d="M658 218H714"/></g>
<g stroke-width="2" font-size="18" text-anchor="middle">
<rect x="32" y="181" width="170" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="260" y="181" width="170" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="488" y="181" width="170" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="716" y="181" width="212" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<g fill="#0f172a"><text x="117" y="211">待機中<tspan x="117" dy="25" font-size="16">Pending</tspan></text><text x="345" y="211">割り当て済み<tspan x="345" dy="25" font-size="16">Assigned</tspan></text><text x="573" y="211">実行中<tspan x="573" dy="25" font-size="16">Running</tspan></text><text x="822" y="211">完了<tspan x="822" dy="25" font-size="16">Completed</tspan></text></g></g>
<!-- 失敗時の再試行は両状態から待機へ -->
<g fill="none" stroke="#f59e0b" stroke-width="2"><path d="M345 181V142H117V179" marker-end="url(#a)"/><path d="M573 181V142H345"/></g>
<text x="135" y="121" font-size="16" fill="#92400e">失敗・タイムアウト → 再試行(残り回数あり)</text>
<!-- ノード消失は回数を消費せず先頭へ -->
<g fill="none" stroke="#2563eb" stroke-width="2"><path d="M345 255V300H117V257" marker-end="url(#a)"/><path d="M573 255V300H345"/></g>
<rect x="140" y="314" width="300" height="60" rx="10" fill="#dbeafe"/>
<text x="155" y="340" font-size="16" fill="#1e40af">ノードが消えた<tspan x="155" dy="24">(回数は消費しない) → 先頭へ</tspan></text>
<!-- 試行上限 -->
<g fill="none" stroke="#dc2626" stroke-width="2"><path d="M430 238H456V393H714" marker-end="url(#a)"/><path d="M658 238H685V393"/></g>
<rect x="716" y="365" width="212" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="822" y="393" font-size="18" text-anchor="middle" fill="#991b1b">失敗<tspan x="822" dy="24" font-size="16">Failed</tspan></text>
<text x="465" y="382" font-size="16" fill="#dc2626">試行回数を使い切った</text>
<!-- キャンセルは3つの活動状態から -->
<g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"><path d="M78 255V487H714" marker-end="url(#a)"/><path d="M290 255V286H96V467H330V487"/><path d="M620 255V278H700V467H560V487"/></g>
<rect x="716" y="456" width="212" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="822" y="483" font-size="18" text-anchor="middle" fill="#475569">キャンセル済み<tspan x="822" dy="24" font-size="16">Cancelled</tspan></text>
<rect x="140" y="451" width="320" height="29" rx="8" fill="white"/><text x="150" y="472" font-size="16" fill="#475569">ジョブのキャンセル（3状態から）</text>
<rect x="32" y="559" width="896" height="198" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="54" y="592" font-size="20" font-weight="bold" fill="#334155">FIFOキュー</text><text x="54" y="620" font-size="16" fill="#475569">先頭から順に割り当て。新規タスクは末尾、ノード消失時は先頭へ。</text>
<g stroke-width="2"><rect x="240" y="651" width="140" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="394" y="651" width="110" height="56" rx="10" fill="white" stroke="#64748b"/><rect x="518" y="651" width="110" height="56" rx="10" fill="white" stroke="#64748b"/><rect x="642" y="651" width="140" height="56" rx="10" fill="#dcfce7" stroke="#16a34a"/></g>
<g font-size="16" text-anchor="middle" fill="#334155"><text x="310" y="685">再キュー</text><text x="449" y="685">タスク</text><text x="573" y="685">タスク</text><text x="712" y="685">新規タスク</text><text x="310" y="735">先頭</text><text x="712" y="735">末尾</text></g>
<path d="M232 679H89" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="93" y="663" font-size="16" fill="#2563eb">割り当て</text><path d="M875 679H790" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
</svg>
