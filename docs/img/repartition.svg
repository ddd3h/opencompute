<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif">
<title>PCの参加と離脱に合わせて領域を再分割する</title><desc>PC1台で2領域を計算する。PC2が参加すると最後のチェックポイントから4領域へ切り直し、2台に割り当てる。PC2が離脱すると2領域に戻す。再分割後も1台で計算した結果とビット単位で一致する。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><g id="pc" stroke="#16a34a" stroke-width="2"><rect width="66" height="40" rx="10" fill="#dcfce7"/><path d="M33 40V50M16 50H50"/></g></defs>
<rect width="960" height="760" rx="10" fill="white"/><text x="32" y="48" font-size="28" font-weight="bold" fill="#0f172a">PCの参加・離脱に合わせて領域を再分割</text>
<rect x="32" y="72" width="896" height="45" rx="10" fill="#f1f5f9"/><text x="52" y="101" font-size="18" fill="#64748b">領域数 = parts_per_node × PC台数　（この例では parts_per_node = 2）</text>
<rect x="32" y="137" width="896" height="134" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="52" y="168" font-size="21" font-weight="bold" fill="#0f172a">① PC1台・2領域</text>
<g stroke-width="2"><rect x="310" y="187" width="195" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="535" y="187" width="195" height="56" rx="10" fill="#dcfce7" stroke="#16a34a"/></g>
<path d="M509 214H531" stroke="#2563eb" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<use href="#pc" x="185" y="190"/><text x="198" y="258" font-size="16" fill="#16a34a">PC1</text><path d="M260 214H300" stroke="#16a34a" stroke-width="2"/>
<g font-size="18" fill="#0f172a" text-anchor="middle"><text x="407" y="222">領域0</text><text x="632" y="222">領域1</text></g>
<path d="M90 282V323" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="115" y="309" font-size="17" fill="#2563eb">最後のチェックポイントから切り直し</text>
<rect x="32" y="337" width="896" height="170" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="52" y="370" font-size="21" font-weight="bold" fill="#0f172a">② PC2が参加 → 4領域に再分割</text>
<g stroke-width="2"><rect x="310" y="393" width="126" height="50" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="466" y="393" width="126" height="50" rx="10" fill="#dcfce7" stroke="#16a34a"/><rect x="622" y="393" width="126" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b"/><rect x="778" y="393" width="126" height="50" rx="10" fill="#f1f5f9" stroke="#64748b"/></g>
<g stroke="#2563eb" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"><path d="M440 418H462"/><path d="M596 418H618"/><path d="M752 418H774"/></g>
<g font-size="18" fill="#0f172a" text-anchor="middle"><text x="373" y="424">領域0</text><text x="529" y="424">領域1</text><text x="685" y="424">領域2</text><text x="841" y="424">領域3</text></g>
<path d="M310 451V461H592V451M622 451V461H904V451" fill="none" stroke="#16a34a" stroke-width="2"/>
<g fill="#16a34a" font-size="17" text-anchor="middle"><text x="451" y="488">PC1が担当</text><text x="763" y="488">PC2が担当</text></g><use href="#pc" x="139" y="396"/><use href="#pc" x="222" y="396"/><g fill="#16a34a" font-size="16"><text x="152" y="470">PC1</text><text x="235" y="470">PC2</text></g>
<path d="M90 518V559" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="115" y="545" font-size="17" fill="#2563eb">最後のチェックポイントから切り直し</text>
<rect x="32" y="573" width="896" height="113" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="52" y="605" font-size="21" font-weight="bold" fill="#0f172a">③ PC2が離脱 → 2領域に戻る</text>
<use href="#pc" x="185" y="618"/><text x="263" y="644" font-size="16" fill="#16a34a">PC1</text>
<rect x="355" y="620" width="240" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="625" y="620" width="240" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M599 643H621" stroke="#2563eb" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<g font-size="18" fill="#0f172a" text-anchor="middle"><text x="475" y="649">領域0</text><text x="745" y="649">領域1</text></g>
<rect x="32" y="706" width="896" height="38" rx="10" fill="#dcfce7"/><text x="51" y="732" font-size="18" fill="#0f172a">再分割しても結果は1台で計算した場合とビット単位で同じ</text>
</svg>
