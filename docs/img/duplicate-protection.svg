<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif">
<title>試行番号で古い結果を拒否する</title><desc>タスク7の試行1を実行するノードAが停止し、ノードBへ試行2を割り当てる。Bの結果を先に採用した後、Aから遅れて届く試行1の結果を古い試行として拒否し、二重確定を防止する時系列図。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect width="960" height="580" rx="20" fill="white"/><text x="32" y="48" font-size="28" font-weight="bold" fill="#0f172a">遅れて届いた結果は、確定しない</text><text x="32" y="81" font-size="17" fill="#64748b">タスク 7：新しい試行の結果だけを採用</text>
<g fill="#f1f5f9"><rect x="32" y="154" width="896" height="100" rx="10"/><rect x="32" y="276" width="896" height="100" rx="10"/><rect x="32" y="399" width="896" height="115" rx="10"/></g>
<path d="M220 125H907" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="821" y="111" font-size="16" fill="#64748b">時間の流れ</text>
<g font-size="18" font-weight="bold" fill="#334155"><text x="53" y="199">ノード A</text><text x="53" y="321">ノード B</text><text x="53" y="446">サーバー</text></g>
<g stroke-width="2"><rect x="219" y="173" width="207" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="453" y="173" width="141" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b"/><rect x="453" y="295" width="237" height="62" rx="10" fill="#dcfce7" stroke="#16a34a"/></g>
<g font-size="17" text-anchor="middle" fill="#0f172a"><text x="322" y="198">タスク 7・試行 1<tspan x="322" dy="24">attempt 1</tspan></text><text x="523" y="198">応答が停止<tspan x="523" dy="24">処理が滞留</tspan></text><text x="571" y="320">タスク 7・試行 2<tspan x="571" dy="24">attempt 2 → 完了</tspan></text></g>
<g fill="none" stroke-width="2" marker-end="url(#a)"><path d="M426 204H451" stroke="#f59e0b"/><path d="M452 241V291" stroke="#2563eb"/><path d="M651 359V411" stroke="#16a34a"/><path d="M594 204H821V411" stroke="#dc2626" stroke-dasharray="6 5"/></g>
<text x="248" y="272" font-size="16" fill="#2563eb">再割り当て →</text><text x="700" y="190" font-size="16" fill="#dc2626">試行 1 の遅延結果</text>
<rect x="477" y="416" width="240" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="597" y="446" font-size="18" text-anchor="middle" fill="#166534" font-weight="bold">✓ 採用・確定<tspan x="597" dy="27" font-size="16" font-weight="normal">試行 2 が先に到着</tspan></text>
<rect x="735" y="416" width="178" height="78" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="824" y="441" font-size="17" text-anchor="middle" fill="#991b1b" font-weight="bold">✕ 拒否：Stale<tspan x="824" dy="23" font-size="15" font-weight="normal">attempt が古い</tspan><tspan x="824" dy="21" font-size="15" font-weight="normal">確定済み結果を維持</tspan></text>
<text x="32" y="551" font-size="17" fill="#475569">照合キー：(task, attempt, node)　→　同じタスクを二重確定しない</text>
</svg>
