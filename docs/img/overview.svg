<text x="169" y="347" text-anchor="middle" font-weight="bold">サーバー:</text><text x="169" y="378" text-anchor="middle"><tspan x="169">仕事を分けて配る・</tspan><tspan x="169" dy="28">結果を集める</tspan></text>
<g fill="none" stroke-width="2"><path d="M307 188H604V145H651" stroke="#2563eb" marker-end="url(#blue)"/><path d="M604 188v94h47" stroke="#2563eb" marker-end="url(#blue)"/><path d="M604 282v137h47" stroke="#2563eb" marker-end="url(#blue)"/><path d="M604 419v137h47" stroke="#2563eb" marker-end="url(#blue)"/><path d="M651 177H626V315H321" stroke="#16a34a" marker-end="url(#green)"/><path d="M651 314h-25m25 137h-25V315m25 273h-25V451" stroke="#16a34a"/></g>
<rect x="331" y="146" width="254" height="31" rx="10" fill="white"/><text x="342" y="168" fill="#2563eb">タスク(小さな計算)</text><rect x="395" y="282" width="74" height="30" rx="10" fill="white"/><text x="409" y="304" fill="#16a34a">結果</text>
<use href="#pc" x="667" y="115"/><use href="#pc" x="667" y="252"/><use href="#pc" x="667" y="389"/><use href="#pc" x="667" y="526"/>
<text x="786" y="154">あなたのPC</text><text x="786" y="291">友だちのPC</text><text x="786" y="428">研究室のPC</text><text x="786" y="565">...</text>
<rect x="332" y="352" width="252" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><g stroke="#64748b" stroke-width="2" fill="none"><path d="M353 382v-9a10 10 0 0 1 20 0v9"/><rect x="348" y="382" width="30" height="25" rx="6"/></g><text x="391" y="394">暗号化・相互認証</text>
