<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="17" fill="#0f172a">
<title>OpenCompute のしくみ</title>
<desc>サーバーが小さな計算を4台のPCに配り、結果を集めます。チケットで身元と合言葉を共有し、利用者の同意後に暗号化・相互認証で接続します。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#2563eb" stroke-width="2"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#16a34a" stroke-width="2"/></marker><g id="pc" stroke="#16a34a" stroke-width="2"><rect width="100" height="65" rx="10" fill="#dcfce7"/><path d="M50 65v15m-25 0h50"/><circle cx="37" cy="29" r="3" fill="#16a34a"/><circle cx="63" cy="29" r="3" fill="#16a34a"/><path d="M39 43q11 10 22 0" fill="none"/></g></defs>
<rect width="960" height="680" rx="10" fill="white"/>
<text x="32" y="49" font-size="28" font-weight="bold">OpenCompute のしくみ</text>
<rect x="32" y="106" width="275" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<g stroke="#2563eb" stroke-width="2" fill="white"><rect x="96" y="143" width="146" height="48" rx="10"/><rect x="96" y="201" width="146" height="48" rx="10"/><rect x="96" y="259" width="146" height="48" rx="10"/></g>
