<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Meiryo, sans-serif" font-size="16" fill="#0f172a">
<title>1 ステップの時間の変化</title>
<desc>N=65,536 の N 体計算で、1 ステップにかかる時間(中央値)が 4,850 ms から約 390 ms に縮んだ過程を示す横棒グラフ。</desc>
<rect width="960" height="440" rx="10" fill="white"/>
<text x="32" y="46" font-size="26" font-weight="bold">1 ステップの時間の変化</text>
<text x="32" y="72" font-size="15" fill="#475569">N=65,536、1 ステップの中央値(ms)。短いほど速い</text>
<path d="M300 92V400" stroke="#e2e8f0"/>
<text x="300.0" y="422" text-anchor="middle" font-size="13" fill="#475569">0</text>
<path d="M412 92V400" stroke="#e2e8f0"/>
<text x="412.0" y="422" text-anchor="middle" font-size="13" fill="#475569">1,000</text>
<path d="M524 92V400" stroke="#e2e8f0"/>
<text x="524.0" y="422" text-anchor="middle" font-size="13" fill="#475569">2,000</text>
<path d="M636 92V400" stroke="#e2e8f0"/>
<text x="636.0" y="422" text-anchor="middle" font-size="13" fill="#475569">3,000</text>
<path d="M748 92V400" stroke="#e2e8f0"/>
<text x="748.0" y="422" text-anchor="middle" font-size="13" fill="#475569">4,000</text>
<path d="M860 92V400" stroke="#e2e8f0"/>
<text x="860.0" y="422" text-anchor="middle" font-size="13" fill="#475569">5,000</text>
<text x="288" y="126" text-anchor="end">出発点</text>
<rect x="300" y="100" width="543" height="36" rx="5" fill="#dc2626"/>
<text x="855.2" y="125" font-weight="bold">4,850 ms</text>
<text x="288" y="186" text-anchor="end">共有入力 + SIMD カーネル</text>
<rect x="300" y="160" width="198" height="36" rx="5" fill="#d97706"/>
<text x="509.68" y="185" font-weight="bold">1,765 ms</text>
<text x="288" y="246" text-anchor="end">配り方とスケジューラの改善</text>
<rect x="300" y="220" width="74" height="36" rx="5" fill="#2563eb"/>
<path d="M364 238H384M364 228v20M384 228v20" stroke="white" stroke-width="2"/>
<text x="396.0" y="245" font-weight="bold">570〜750 ms</text>
<text x="288" y="306" text-anchor="end">ネイティブカーネル(AVX2)</text>
<rect x="300" y="280" width="50" height="36" rx="5" fill="#2563eb"/>
<text x="362.4" y="305" font-weight="bold">450 ms</text>
<text x="288" y="366" text-anchor="end">自動チューニング + ForgetJob</text>
<rect x="300" y="340" width="44" height="36" rx="5" fill="#16a34a"/>
<path d="M341 358H346M341 348v20M346 348v20" stroke="white" stroke-width="2"/>
<text x="357.92" y="365" font-weight="bold">365〜410 ms</text>
<path d="M378 88V392" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="386.4" y="86" font-size="14" font-weight="bold" fill="#dc2626">目標 700 ms</text>
</svg>
